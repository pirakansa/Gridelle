# Build and deploy static content to GitHub Pages on manual dispatch.
name: Deploy static content

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Validate version tag
        id: version
        run: |
          # Resolve the package version and prevent reusing it for another commit.
          tag=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          git check-ref-format "refs/tags/$tag"
          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          create=true
          if [ -n "$remote_tag" ]; then
            git fetch --depth=1 origin "refs/tags/$tag"
            if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Version tag $tag already points to another commit. Update package.json before deploying."
              exit 1
            fi
            create=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create=$create" >> "$GITHUB_OUTPUT"

      - name: Install vorbere
        uses: pirakansa/vorbere@v0
        with:
          version: v0.3.1

      - name: Install dependency
        run: vorbere run setup

      - name: Build
        run: vorbere run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag deployed version
        if: steps.version.outputs.create == 'true'
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Tag the deployed commit only after Pages deployment succeeds.
          git tag "$VERSION_TAG" HEAD
          git push origin "refs/tags/$VERSION_TAG"
