# Check, test, and build static content
name: Static content CI

on:
  # Runs on pull requests targeting the default branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install vorbere
        uses: pirakansa/vorbere@v0
        with:
          version: v0.3.1

      - name: Install dependency
        run: vorbere run setup

      - name: Check
        run: vorbere run check

      - name: Test
        run: vorbere run test

      - name: Build
        run: vorbere run build
